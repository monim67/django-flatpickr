[project]
name = "django-flatpickr"
version = "0.0.0"
description = """\
    Flatpickr based DatePickerInput, TimePickerInput and \
    DateTimePickerInput with date-range-picker functionality \
    for django >= 2.0\
    """
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
authors = [{ name = "Abdul Monim" }]
keywords = [
    "django",
    "flatpickr",
    "date-picker",
    "time-picker",
    "datetime-picker",
    "date-range-picker",
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 2.0",
    "Framework :: Django :: 3.0",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 5.0",
]
dependencies = [
    "Django>=2,<6",
    "pydantic>=1,<3",
    "pydantic-settings",
]

[project.urls]
repository = "https://github.com/monim67/django-flatpickr"

[tool.poetry]
packages = [{ include = "django_flatpickr", from = "src" }]

[tool.poetry.group.build.dependencies]
pytest-django = "^4.5.2"
pytest-dotenv = "^0.5.2"
black = "^26.5.1"
isort = "^5.10.1"
pydocstyle = {extras = ["toml"], version = "^6.1.1"}
pyright = "^1.1.350"
django-stubs = "~6.0.9"
coverage = { extras = ["toml"], version = "^6.5.0" }
pylint = "^2.12.0"
website-downloader = "^2.6.1"
poethepoet = "^0.15.0"
django-crispy-forms = "^1.14.0"
crispy-bulma = "^0.8.0"
django-filter = "^26.1"
mdformat = "^1.0.0"
mdformat-mkdocs = "^5.3.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-llmstxt-md = "^0.3.0"

[tool.poetry.group.dev.dependencies]
tox = "^4.61.1"
tox-uv-bare = "^1.36.0"
pre-commit = "^2.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.requires-plugins]
poetry-bumpversion = ">=0.3.3"

[tool.poetry_bumpversion.file."src/django_flatpickr/__init__.py"]

[tool.pylint.master]
disable = ["R", "C", "missing-docstring", "unused-argument"]

[tool.pylint.format]
max-line-length = 88

[tool.black]
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.isort]
py_version = "310"
profile = "black"

[tool.pydocstyle]
convention = "google"
add_select = "D401,D404"

[tool.pyright]
include = ["src", "dev", "tests"]

[tool.django-stubs]
django_settings_module = "dev.mysite.settings"

[tool.pytest.ini_options]
pythonpath = "." # pytest-django needs it to find dev module
django_find_project = false
DJANGO_SETTINGS_MODULE = "dev.mysite.settings"
testpaths = ["tests"]
env_files = [".env", ".env.defaults"]

[tool.coverage.run]
command_line = "-m pytest"
source = ["django_flatpickr"]
parallel = true

[tool.coverage.paths]
source = [
    "src/django_flatpickr",
    "**/site-packages/django_flatpickr",
]

[tool.tox]
requires = ["tox>=4"]
env_list = ["3.14", "3.13", "3.12", "3.11", "3.10"]

[tool.tox.env_run_base]
skip_install = true
allowlist_externals = ["bash"]
commands_pre = [["bash", "tests/install-tox-deps.bash"]]
commands = [["pytest"]]

[tool.poe]
envfile = [".env.defaults", ".env"]

[tool.poe.tasks]
start = { cmd = "python dev/manage.py runserver localhost:8000", help = "Start dev server (press F5 on vscode)" }
lint = [
    { cmd = "python -m black --check src tests dev" },
    { cmd = "python -m isort --check-only src tests dev" },
    { cmd = "pyright" },
    { cmd = "pydocstyle src" },
    { cmd = "mdformat --check README.md docs" },
]
test-cov = [
    { cmd = "coverage run" },
    { cmd = "coverage combine" },
    { cmd = "coverage lcov -o coverage/lcov.info" },
    { cmd = "coverage report" },
]
